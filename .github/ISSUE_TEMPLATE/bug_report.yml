name: Bug Report
description: File an issue about incorrect scanning, crashed execution, or formatting bugs
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue with readme-scan.
  - type: input
    id: version
    attributes:
      label: readme-scan Version
      description: What version of readme-scan are you using? (Run `readme-scan --version`)
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node.js Version
      description: What version of Node.js are you running? (Run `node -v`)
      placeholder: "v20.x or v22.x"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Linux
        - macOS
        - Windows
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Problem Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps or repository structure to reproduce the behavior.
      placeholder: |
        1. Run `readme-scan ...`
        2. Inspect output
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
